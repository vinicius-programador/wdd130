<!DOCTYPE html>
<HTML lang="pt-br">

<head>
    <link rel="stylesheet" href="estilos/contato.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale conosco Corredeiras Raffitng</title>
    <meta name="description"
      content="Uma pagina de uma empresa de rafitng, e nessa pagina falamos sobre a empresa">
    <meta name="author" content="Vinicius Hermes">
</head>

<body>
    <header>
        <img src="imagens/logotipo.png" alt="logotipo da empresa" width="150">

        <nav>
            <ul classe="navegacao">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>

            </ul>


        </nav>
    </header>

    <main>
        <div class="informacoes">
            <h1>COMPANHIA DE RAFITING EM CORREDEIRAS</h1>
            <p>Av. Presidente Castelho Branco</p>
            <p>Ribeirão Preto - Sp</p>
            <p>Telefone 16-982124447</p>
            <p>corredeirasrafiting@gmail.com</p>

        </div>


        <div class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d33649.03090391854!2d-47.8348143871218!3d-21.18119298660245!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b9bf1d68acc21d%3A0x37b8ee0abedeea39!2sRibeir%C3%A3o%20Preto%2C%20SP!5e0!3m2!1spt-BR!2sbr!4v1791047909856!5m2!1spt-BR!2sbr"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">width 10px</iframe>


            </div>
            <div class="form_box">
                <form>
                    <fieldset>

                        <div class="item-formulario coluna1">
                            <label for="nome-completo">Nome completo:</label>
                            <input type="text" id="nome-completo" name="nome-completo" required>
                        </div>

                        <div class="item-formulario coluna 2">

                            <label for="email-do-usuario"> E-mail:</label>
                            <input type="email" id="email-do-usuario" name="email-do-usuario"
                              required>
                        </div>

                    </fieldset>

                    <Fieldset>

                        <div class="item-formulario coluna3">
                            <label>Propósito da Mensagem</label>

                            <div>
                                <input type="radio" id="duvida" name="proposito">
                                <label for="duvida">Dúvida Geral</label>
                            </div>

                            <div>
                                <input type="radio" id="reserva" name="proposito">
                                <label for="reserva">Pergunta sobre Reserva</label>
                            </div>

                            <div>
                                <input type="radio" id="sugestao" name="proposito">
                                <label for="sugestao">Sugestão</label>
                            </div>
                        </div>
                    </Fieldset>
                    <div class="item-formulario coluna4">
                        <label for="mensagem">Mensagem:</label>
                        <textarea name="mensagem" id="mensagem" rows="3"></textarea>
                    </div>

                    <fieldset>
                        <div class="item-formulario coluna5">
                            <label for="inscreva">Me mande email com novidades!</label>
                            <input type="checkbox" id="inscreva" name="novidades">


                        </div>

                    </fieldset>


                    <button type="submit">Entrar em contato!</button>


                </form>


            </div>
        </div>

        <div class="container-funcionario">
            <h2>ESTAMOS AQUI PARA SERVÍ-LO</h2>
            <section class="funcionarios">
                <figure>
                    <img src="imagens/rosto-1.jfif" alt="rosto fernando">
                    <figcaption>Fernando Gerente</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rosto-2.jfif" alt="rosto patricia">
                    <figcaption>Patricia Instrutora</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rosto-3.jfif" alt="rosto fernando">
                    <figcaption>Marcos Instrutor</figcaption>
                </figure>


            </section>


        </div>


    </main>


    <footer>
        <p>&copy; 2026 - Contato Raffitng | Vinicius Hermes</p>
        <nav class="redes-sociais">
            <a href="https://www.facebook.com/">
                <img src="imagens/facebook.svg" alt="icone do facebook" width="100"></a>
            <a href="https://www.instagram.com/">
                <img src="imagens/instagram.svg" alt="icone do instagram" width="100"></a>
            <a href="https://www.linkedin.com/">
                <img src="imagens/linkedin.svg" alt="icone do linkedin" width="100"></a>
    </footer>

</body>

</HTML>
