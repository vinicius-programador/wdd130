<!DOCTYPE html>
<html lang="pt-br">

<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
    <title>FORMULÁRIO</title>

</header>


<main>
    <h1>WDD130 | Formulário HTML - Enquete do usuário</h1>
    <form>
        <fieldset>
            <legend>Informaçõe de contato</legend>
            <div class="item-formulario coluna2">
                <label for="nomecompleto">Nome completo:</label>
                <input type="text" id="nome-completo" name="nome-completo" required>
            </div>

            <div class="item-formulario coluna 2">

                <label for="emaildousuario"> E-mail:</label>
                <input type="email" id="email-do-usuario" name="email-do-usuario" required>
            </div>

        </fieldset>

        <Fieldset>
            <legend>Perguntas</legend>
            <div class="item-formulario coluna1">
                <label for="navegador">Qual seu navegador favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="Chrome">Chrome</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Edge">Edge</option>
                    <option value="Brava">Brava</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="item-formulario coluna1">
                <label for="pet">Você tem um bichinho de estimação?:</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="item-formulario">
                <label for="lugares">Quais lugares onde você morou?</label>
                <textarea name="lugares" id="lugares" rows="4"></textarea>
            </div>
        </Fieldset>


        <button type="submit">Enviar pesquisa</button>


    </form>


</main>

<footer>
    <p>&copy; 2026 | Formulário HTML - ATIVIDADE DE PESQUISA DE USUÁRIO | VINICIUS HERMES</p>

</footer>
